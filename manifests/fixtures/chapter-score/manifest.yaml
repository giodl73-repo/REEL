manifest_version: reel.manifest.v0.2
profile: animatic
timing_status: conformed
work: chapter-score-fixture
title: Chapter Score Direction Fixture
format: short-film
style: storyboard-animatic
platforms:
  - { name: private-review, aspect_ratio: "16:9", target_duration_seconds: 12.0, sound_optional: false }
scenes:
  - { id: journey, duration_seconds: 12.0, purpose: prove score direction, story_beat: one motif changes with place }
shots:
  - { id: home, scene_id: journey, start_seconds: 0.0, duration_seconds: 4.0 }
  - { id: desert, scene_id: journey, start_seconds: 4.0, duration_seconds: 4.0 }
  - { id: city, scene_id: journey, start_seconds: 8.0, duration_seconds: 4.0 }
beat_markers:
  - { id: opening, time_seconds: 0.0 }
  - { id: desert-arrival, time_seconds: 4.0, accent: true }
  - { id: city-arrival, time_seconds: 8.0, accent: true }
score:
  originality_policy: original-only
  creative_brief: Carry one original persistence motif through reflective, desert, and metropolitan movie-montage palettes.
  global_instruments:
    - family: brass
      role: recurring identity
      timbre: warm, human, and increasingly confident
      articulations: [distant swell, short accent, final fanfare]
  motifs:
    - id: persistence
      description: a rising three-note idea that survives every change in setting
      instruments: [brass, plucked strings, piano]
      recurrence_notes: reharmonize and re-orchestrate it rather than repeating one recording
  avoid:
    - copyrighted melodies
    - artist imitation
    - generic wall-to-wall trailer percussion
  cues:
    - id: reflective-home
      start_seconds: 0.0
      duration_seconds: 4.0
      chapter: Home
      narrative_function: begin intimate and unresolved
      mood_from: uncertain
      mood_to: quietly determined
      energy_from: 0.15
      energy_to: 0.35
      tempo_bpm: 68
      meter: 4/4
      style_tags: [reflective, movie-montage]
      motif_ids: [persistence]
      transition_out: descend on a clear three-note phrase before the geography changes
      montage_intent: leave space around dialogue and natural sound
      sync_points:
        - { id: first-note, time_seconds: 0.0, kind: downbeat, beat_marker_id: opening, emphasis: 0.4 }
    - id: desert-lift
      start_seconds: 4.0
      duration_seconds: 4.0
      chapter: Desert
      narrative_function: turn uncertainty into first professional momentum
      mood_from: displaced
      mood_to: playful
      energy_from: 0.3
      energy_to: 0.75
      tempo_bpm: 108
      style_tags: [sunlit, festival-color, montage]
      instruments:
        - { family: hand-percussion, role: pulse, timbre: dry and close }
        - { family: plucked-strings, role: hook, timbre: airy, articulations: [muted pluck] }
      motif_ids: [persistence]
      transition_in: begin on the arrival image, not one cut early
      montage_intent: support fast action while preserving complete scoring calls
      picture_notes: [accent the arrival, do not hit every edit]
      sync_points:
        - { id: arrival-hit, time_seconds: 4.0, kind: transition, beat_marker_id: desert-arrival, emphasis: 0.9 }
    - id: city-release
      start_seconds: 8.0
      duration_seconds: 4.0
      chapter: City
      narrative_function: release the accumulated motif with forward motion
      mood_from: watchful
      mood_to: exhilarated
      energy_from: 0.45
      energy_to: 1.0
      tempo_bpm: 126
      style_tags: [metropolitan, brass-led, subway-pulse]
      instruments:
        - { family: piano, role: rhythmic hook, timbre: bright and percussive }
        - { family: low-percussion, role: transit pulse, timbre: mechanical but warm }
      motif_ids: [persistence]
      transition_in: restart cleanly after a short hush
      transition_out: land on a confident open cadence
      sync_points:
        - { id: city-hit, time_seconds: 8.0, kind: picture-hit, beat_marker_id: city-arrival, emphasis: 1.0 }
audio:
  narration_voice: none
  music_direction: compiled from score
  effects_direction: preserve selected natural sound
  silence_notes: protect the chapter handoffs
captions: { required: false, style: none, language: en }
renderer_assumptions: { candidates: [external-composer, music-model, ffmpeg], blockers: [] }
exports:
  - { id: private-review, filename: chapter-score-fixture.mp4, aspect_ratio: "16:9", duration_seconds: 12.0 }
review: { required_roles: [sound, editor], status: fixture }
