    assets: []
    human_review_gate: { required: true, status: pending, reviewer_role: human-hair-makeup-lead }
  performance:
    intent: Preserve action motivations and protected emotional space without prescribing emotion.
    source_evidence: [ev-letter-middle, ev-audio-late]
    continuity_refs: [middle-desk, late-chair]
    owner: performance-department
    status: planned
    assets: []
    human_review_gate: { required: true, status: pending, reviewer_role: human-director-and-performer }
  editing:
    intent: Protect action causality, eye trace, disclosure holds, and sound bridges across periods.
    source_evidence: [ev-photo-early, ev-letter-middle, ev-audio-late, ev-reconstruction-policy]
    continuity_refs: [early-room-a, middle-desk, late-chair]
    owner: editing-department
    status: in-progress
    assets: []
    human_review_gate: { required: true, status: pending, reviewer_role: human-editor }
  sound:
    intent: Carry location and period transitions with room tone while leaving final sound choices unresolved.
    source_evidence: [ev-audio-late]
    continuity_refs: [early-room-a, middle-desk, late-chair]
    owner: sound-department
    status: planned
    assets: [asset-late-clock]
    human_review_gate: { required: true, status: pending, reviewer_role: human-sound-designer }
  score:
    intent: Record where score decisions are pending without deciding which moments deserve music.
    source_evidence: [ev-audio-late]
    continuity_refs: [middle-desk, late-chair]
    owner: score-department
    status: blocked
    assets: []
    human_review_gate: { required: true, status: pending, reviewer_role: human-composer-and-director }
  animation-vfx:
    intent: Track compositing layers, contacts, depth, cleanup, and reconstruction disclosure.
    source_evidence: [ev-letter-middle, ev-audio-late, ev-reconstruction-policy]
    continuity_refs: [middle-desk, late-chair]
    owner: animation-vfx-department
    status: planned
    assets: [asset-middle-letter, asset-rain-layer, asset-late-clock]
    human_review_gate: { required: true, status: pending, reviewer_role: human-vfx-supervisor }
  accessibility:
