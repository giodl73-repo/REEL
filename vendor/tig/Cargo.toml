[workspace]
members = ["crates/tig-core", "crates/tig-store", "crates/tig-git", "crates/tig-assets"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/giodl73-repo/tig"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.11.0"
