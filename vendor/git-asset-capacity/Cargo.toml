[workspace]
members = ["crates/core", "crates/store", "crates/git-asset", "crates/model"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/giodl73-repo/git-asset"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.11.0"
