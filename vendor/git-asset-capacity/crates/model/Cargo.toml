[package]
name = "git-asset-model"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "git-asset-publication"
path = "src/bin/git-asset-publication.rs"
required-features = ["schema"]

[features]
schema = ["dep:jsonschema"]

[dependencies]
git-asset-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
jsonschema = { version = "=0.60.2", default-features = false, optional = true }

[dev-dependencies]
tempfile = "=3.27.0"
