[package]
name = "reel-publication"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Format, edition and named artifact-set contracts for REEL publications"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
anyhow = { version = "1.0.100", optional = true }
base64 = { version = "0.22.1", optional = true }
sha2 = { version = "0.11.0", optional = true }
reel-print = { path = "../reel-print", optional = true }
resvg = { version = "=0.45.1", default-features = false, features = ["text"], optional = true }

[features]
comic = ["dep:anyhow", "dep:base64", "dep:sha2", "dep:reel-print", "dep:resvg"]

[[test]]
name = "comic"
path = "tests/comic.rs"
required-features = ["comic"]

[dev-dependencies]
tempfile = "3.24.0"
lopdf = { version = "=0.42.0", default-features = false }
