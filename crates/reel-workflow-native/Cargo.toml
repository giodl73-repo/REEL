[package]
name = "reel-workflow-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Exact native inputs and explicit durable input claims for REEL workflows"

# Isolated dependency graph: do not upgrade existing REEL producer SDKs implicitly.
[workspace]

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
fs2 = "=0.4.3"
reel-assets = { path = "../reel-assets" }
reel-workflow = { path = "../reel-workflow" }
reel-workflow-http = { path = "../reel-workflow-http" }
reel-publication = { path = "../reel-publication", features = ["comic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tig-core = { path = "../../vendor/tig-workflow/crates/tig-core" }
tig-assets = { path = "../../vendor/tig-workflow/crates/tig-assets" }
tig-git = { path = "../../vendor/tig-workflow/crates/tig-git", features = ["assets"] }
tig-store = { path = "../../vendor/tig-workflow/crates/tig-store" }

[dev-dependencies]
reel-assembly = { path = "../reel-assembly" }
tempfile = "=3.27.0"
resvg = { version = "=0.45.1", default-features = false, features = ["text"] }
