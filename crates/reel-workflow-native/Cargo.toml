[package]
name = "reel-workflow-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Exact native inputs, protected manual handoffs and retained-result recovery for REEL workflows"

# Separate workspace/lock: existing producers retain vendor/tig unchanged.
[workspace]

[features]
film = ["dep:reel"]

[dependencies]
reel = { path = "../..", optional = true, default-features = false }
anyhow = "1.0.100"
fs2 = "=0.4.3"
reel-assets = { path = "../reel-assets" }
reel-workflow = { path = "../reel-workflow" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.11.0"
tig-core = { path = "../../vendor/tig-workflow/crates/tig-core" }
tig-assets = { path = "../../vendor/tig-workflow/crates/tig-assets" }
tig-git = { path = "../../vendor/tig-workflow/crates/tig-git", features = ["assets"] }
tig-store = { path = "../../vendor/tig-workflow/crates/tig-store" }
git-asset-capacity = { package = "git-asset-store", path = "../../vendor/git-asset-capacity/crates/store" }

[dev-dependencies]
tempfile = "=3.27.0"
