[package]
name = "reel-workflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Bounded task and returned-candidate contracts for REEL workflow adapters"

[features]
comic = ["reel-publication/comic"]

[dependencies]
reel-publication = { path = "../reel-publication" }
reel-assembly = { path = "../reel-assembly" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.24.0"
resvg = { version = "=0.45.1", default-features = false }

[[test]]
name = "layered"
path = "tests/layered.rs"
required-features = ["comic"]

[[test]]
name = "reading_issue"
path = "tests/reading_issue.rs"
required-features = ["comic"]
