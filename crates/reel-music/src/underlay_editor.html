<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Lyric underlay workshop</title><style>
:root{color-scheme:dark;font:16px/1.5 system-ui;background:#171e23;color:#edf0e9}*{box-sizing:border-box}body{margin:0}header,main{padding:20px 28px;max-width:1250px;margin:auto}header{border-bottom:1px solid #47565c}h1{font-size:27px;margin:0}p{color:#becbcf}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0}button,input,select,textarea{font:inherit}button{background:#284d4f;color:#fff;border:1px solid #709b99;border-radius:6px;padding:6px 10px;cursor:pointer}button:disabled{opacity:.45;cursor:default}input,select,textarea{background:#1e2c32;color:#fff;border:1px solid #788d93;border-radius:4px;padding:6px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ffcc86}label{display:block;margin:10px 0}#lyrics{display:block;width:100%;min-height:190px;resize:vertical;white-space:pre-wrap}#candidate,#rationale{display:block;width:100%;max-width:750px}#rationale{min-height:65px}.span{padding:12px;margin:10px 0;border:1px solid #4f666c;border-radius:7px}.active{border:2px solid #e4bd78}.text{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}.small{font-size:14px}#status{color:#ffcf9a;min-height:26px}select{max-width:100%}@media(max-width:650px){header,main{padding:16px}h1{font-size:23px}}
</style><header><h1>Lyric underlay workshop</h1><p id="model"></p><p>Choose a span, select its exact text below, then assign the first and last notes. A span can cover several notes for a melisma.</p><p class="small">Lyrics are read-only. These are unreviewed notation proposals; listening, lyric/vocal review and full model validation remain separate.</p></header>
<main><label>Exact source lyrics <textarea id="lyrics" readonly aria-label="Read-only source lyrics"></textarea></label>
<div class="toolbar"><button id="use">Use selected text</button><button id="add">Add span</button><button id="undo" disabled>Undo</button><button id="reset">Reset</button><button id="open">Open draft</button><input id="file" type="file" accept="application/json,.json" hidden><button id="save" disabled>Save draft</button></div>
<label>New model ID <input id="candidate" maxlength="256"></label><label>Reason for this underlay proposal <textarea id="rationale" maxlength="4096"></textarea></label>
<p id="status" role="status" aria-live="polite"></p><datalist id="note-choices"></datalist><div id="spans"></div><div class="toolbar"><button id="previous">Previous page</button><span id="page"></span><button id="next">Next page</button></div></main><script src="editor.js"></script></html>
