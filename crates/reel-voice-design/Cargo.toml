[package]
name = "reel-voice-design"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Explicit private synthetic voice design previews and candidate saving"

[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
base64 = "0.22.1"
zeroize = "1.8.2"
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
