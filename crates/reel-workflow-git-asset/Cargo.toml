[package]
name = "reel-workflow-git-asset"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Isolated public git-asset input adapter for REEL workflow contracts"

[workspace]

[dependencies]
reel-workflow = { path = "../reel-workflow" }
reel-publication = { path = "../reel-publication" }
git-asset = { git = "https://github.com/giodl73-repo/git-asset", rev = "3ddeab5572f9479475134e6b7334a26effcb9277", features = ["assets", "annex-publish"] }
git-asset-core = { git = "https://github.com/giodl73-repo/git-asset", rev = "3ddeab5572f9479475134e6b7334a26effcb9277" }
git-asset-store = { git = "https://github.com/giodl73-repo/git-asset", rev = "3ddeab5572f9479475134e6b7334a26effcb9277" }
git-asset-model = { git = "https://github.com/giodl73-repo/git-asset", rev = "3ddeab5572f9479475134e6b7334a26effcb9277" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
tempfile = "=3.27.0"
