[package]
name = "reel-workflow-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Bounded provider/proxy transport and original-operation recovery for REEL"

# Keep transport dependencies separate from existing producer and SDK pins.
[workspace]

[dependencies]
reel-workflow = { path = "../reel-workflow" }
reel-assets = { path = "../reel-assets" }
base64 = "0.22.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[dev-dependencies]
tempfile = "=3.27.0"
