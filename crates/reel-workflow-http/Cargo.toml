[package]
name = "reel-workflow-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Bounded HTTP provider/proxy calls with explicit durable intent and no effect retries"

[workspace]

[dependencies]
reel-workflow = { path = "../reel-workflow" }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
tempfile = "=3.27.0"
