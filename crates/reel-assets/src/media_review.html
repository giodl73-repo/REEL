<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private media review</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3efe5;color:#213b35;font:16px system-ui,sans-serif}header{background:#123e36;color:#fff8e8;padding:30px max(24px,calc((100vw - 1280px)/2));border-bottom:4px solid #c49447}h1{font:38px Georgia,serif;margin:10px 0}header p{max-width:1050px;line-height:1.6;color:#dce5db}main{max-width:1328px;margin:auto;padding:26px 24px}select{font:inherit;padding:8px;margin:0 12px 20px 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:24px}.card{background:#fffdf7;border:1px solid #d7d3c6;border-radius:10px;padding:18px}h2{font:24px Georgia,serif;margin:0 0 15px}video,img{display:block;width:100%;max-height:560px;object-fit:contain;background:#14211e}audio{width:100%}.note{font-size:13px;color:#567168}#error{color:#a12d24}</style></head><body><header><p>Private workshop</p><h1 id="title">Media review</h1><p id="notice"></p></header><main><label>Language<select id="language"><option value="">All languages</option><option value="es">Spanish</option><option value="en">English</option></select></label><p id="error" role="status"></p><div class="grid" id="items"></div><p class="note">Review copies preserve exact selected bytes. Approval remains tied to the owner's stated subjects and use.</p></main><script src="editor.js" defer></script></body></html>
