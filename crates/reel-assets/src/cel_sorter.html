<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Editor de cels</title><style>
:root{color-scheme:dark;font:16px/1.5 system-ui}*{box-sizing:border-box}body{margin:0;background:#151b1b;color:#eee9dd}header{padding:20px 28px;border-bottom:1px solid #43514b}h1{font-size:25px;margin:0}p{margin:6px 0;color:#bac8c0}button,input,select{font:inherit}button{background:#34483e;color:#fff;border:1px solid #6c8f7b;border-radius:7px;padding:7px 11px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #edbd7a}main{display:grid;grid-template-columns:minmax(360px,46%) 1fr;gap:20px;padding:20px}aside{position:sticky;top:10px;align-self:start}#preview{width:100%;aspect-ratio:16/9;object-fit:contain;background:#080b0a}audio{width:100%;margin:12px 0}#seek{width:100%}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.card{display:grid;grid-template-columns:130px 1fr;gap:12px;margin-bottom:12px;padding:12px;border:1px solid #526258;border-radius:8px;background:#202a25}.card.selected{border:2px solid #e7bd7d}.card.dragging{opacity:.4}.thumb{width:130px;aspect-ratio:16/9;object-fit:contain;background:#080b0a;cursor:pointer}.detail{min-width:0}.detail input{width:95px;padding:4px}.detail select{width:100%;margin:6px 0}.meta{font-size:13px;color:#b9c5bd}.small{font-size:13px}.error{color:#ffaf9e}#status{min-height:24px}#filmstrip{max-width:850px}.note{width:100%;min-height:65px;font:inherit;background:#1b241e;color:#eee;border:1px solid #708073;padding:8px}@media(max-width:850px){main{grid-template-columns:1fr}aside{position:relative;top:0}.card{grid-template-columns:105px 1fr}.thumb{width:105px}} </style>
<header><h1 id="title">Editor de cels</h1><p>Arrastra las tarjetas para cambiar el orden. Ajusta las pausas o cambia una imagen por otra de la misma secuencia.</p><p class="small">La canción se conserva completa. Los cambios se guardan en este navegador; «Guardar borrador» descarga una copia para aplicar a la próxima revisión.</p></header>
<main><aside><img id="preview" alt="Cel seleccionado"><audio id="audio" controls preload="metadata" src="performance.mp4"></audio><input id="seek" type="range" min="0" step="0.01" value="0" aria-label="Posición en la canción"><div id="clock"></div><div class="toolbar"><button id="prev">← Anterior</button><button id="next">Siguiente →</button><button id="fit">Ajustar al largo de la canción</button></div><div class="toolbar"><button id="save">Guardar borrador</button><button id="open">Abrir borrador</button><input id="file" type="file" accept="application/json,.json" hidden><button id="undo">Deshacer</button><button id="reset">Volver al original</button></div><label for="notes">Notas para la próxima revisión</label><textarea class="note" id="notes" placeholder="Cambios, cels nuevos que faltan, detalles…"></textarea><p id="status" role="status"></p></aside><section id="filmstrip" aria-label="Secuencia de cels"></section></main><script src="editor.js"></script></html>
