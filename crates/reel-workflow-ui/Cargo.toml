[package]
name = "reel-workflow-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Read-only visual production board over exact previews and workflow journals"

[workspace]

[dependencies]
reel-workflow = { path = "../reel-workflow" }
reel-publication = { path = "../reel-publication" }
reel-assets = { path = "../reel-assets" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
getrandom = "=0.3.4"
sha2 = "0.11"

[dev-dependencies]
tempfile = "=3.27.0"
png = "=0.17.16"
