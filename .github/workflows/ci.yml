name: CI

on:
  push:
  pull_request:

concurrency:
  group: reel-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - name: Validate untimed production fixture
        run: cargo run --quiet -- validate manifests/fixtures/two-speaker-untimed/planning.yaml --output json
      - name: Validate v0.2.1 composition contracts
        run: |
          cargo run --quiet -- series-validate manifests/templates/episodic-series.yaml --output json
          cargo run --quiet -- series-coverage manifests/templates/episodic-series.yaml --output json
          cargo run --quiet -- series-review-queue manifests/templates/episodic-series.yaml --output json
          cargo run --quiet -- continuity-validate manifests/fixtures/shared-continuity/registry.yaml --output json

  ffmpeg-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned GPL FFmpeg build
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3 # v1.2.5
        with:
          version: "8.1"
          token: ${{ github.token }}
      - name: Record FFmpeg build and verify required capabilities
        run: |
          mkdir -p target
          cargo run --quiet -- render-doctor --output json | tee target/render-environment.json
          jq -e '.schema == "reel.render-environment.v0.1" and .passed and (.checks | all(.available))' target/render-environment.json
      - run: |
          mkdir -p target/ci-assets
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i color=c=navy:s=1280x720 -frames:v 1 target/ci-assets/frame-01.png
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i color=c=maroon:s=1280x720 -frames:v 1 target/ci-assets/frame-02.png
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i anullsrc=r=48000:cl=stereo -t 8 target/ci-assets/guide.wav
          cargo run --quiet -- conform manifests/fixtures/two-speaker-untimed/planning.yaml --cues manifests/fixtures/two-speaker-untimed/cue-measurements.yaml --speaker-tempo narrator=85 --output-dir target/ci-conform
          cargo run --quiet -- animatic-render target/ci-conform/manifest.yaml --asset-root target/ci-assets --audio target/ci-assets/guide.wav --narration-only-audio target/ci-assets/guide.wav --effects-music-audio target/ci-assets/guide.wav --captions target/ci-conform/captions.srt --output target/ci-animatic.mp4 --format json
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 target/ci-animatic.mp4
          cargo run --quiet -- animatic-render manifests/fixtures/vertical-sound-off/manifest.yaml --asset-root manifests/fixtures/vertical-sound-off --silent --captions manifests/fixtures/vertical-sound-off/captions.srt --width 720 --height 1280 --output target/ci-vertical-sound-off.mp4 --format json
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x target/ci-vertical-sound-off.mp4)" = "720x1280"
          test -z "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 target/ci-vertical-sound-off.mp4)"
          test "$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 target/ci-vertical-sound-off.mp4)" = "6.000000"
      - name: Verify v0.2.6 motion, lineage, and privacy-safe receipt
        run: |
          cargo test --test v022_cli real_sanitized_pan_makes_legacy_fail_and_smooth_pass -- --ignored --exact
          mkdir -p target/ci-motion
          cargo run --quiet -- animatic-render manifests/fixtures/smooth-motion/manifest.yaml --asset-root manifests/fixtures/smooth-motion --silent --captions manifests/fixtures/smooth-motion/captions.srt --output target/ci-motion/smooth.mp4 --motion-quality smooth --motion-curve ease-in-out --format json
          cargo run --quiet -- animatic-render manifests/fixtures/smooth-motion/manifest.yaml --asset-root manifests/fixtures/smooth-motion --silent --captions manifests/fixtures/smooth-motion/captions.srt --output target/ci-motion/legacy.mp4 --motion-quality legacy --format json
          cargo run --quiet -- motion-analyze target/ci-motion/smooth.mp4 --output json > target/ci-motion/smooth-cadence.json
          cargo run --quiet -- motion-check manifests/fixtures/smooth-motion/manifest.yaml target/ci-motion/smooth.mp4 --output json > target/ci-motion/smooth-motion-check.json
          cargo run --quiet -- animatic-check target/ci-motion/smooth.artifacts.json --output json > target/ci-motion/smooth-animatic-check.json
          cargo run --quiet -- animatic-receipt target/ci-motion/smooth.artifacts.json --output target/ci-motion/smooth.receipt.json --format json > target/ci-motion/smooth-receipt-command.json
          if cargo run --quiet -- motion-analyze target/ci-motion/legacy.mp4 --output json > target/ci-motion/legacy-cadence.json; then exit 1; fi
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of csv=p=0:s=x target/ci-motion/smooth.mp4)" = "1280x720x24/1"
          test "$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 target/ci-motion/smooth.mp4)" = "20.000000"
          jq -e '.tool_version == "0.2.6" and .render_environment.schema == "reel.render-environment.v0.1" and .render_environment.passed and (.render_environment.fingerprint_sha256 | length == 64) and (.render_environment.checks | length == 7 and all(.available)) and .motion.backend == "ffmpeg-perspective" and .motion.interpolation == "cubic" and .motion.curve == "ease-in-out" and .motion.safety[0].passed and .output_duration_ms == 20000' target/ci-motion/smooth.artifacts.json
          jq -e '.schema == "reel.animatic-receipt.v0.1" and .verified and (.source_artifact_sha256 | length == 64) and (.output_sha256 | length == 64) and (.render_environment_fingerprint | length == 64)' target/ci-motion/smooth.receipt.json
          if grep -Eq '(/home/|/github/workspace|target/ci-motion|artifact_manifest|"path")' target/ci-motion/smooth.receipt.json; then exit 1; fi
          ffmpeg -y -hide_banner -loglevel error -i target/ci-motion/legacy.mp4 -i target/ci-motion/smooth.mp4 -filter_complex "[0:v]scale=640:360,drawtext=text='LEGACY':x=24:y=24:fontsize=28:fontcolor=white:box=1:boxcolor=black@0.65[left];[1:v]scale=640:360,drawtext=text='SMOOTH v0.2.6':x=24:y=24:fontsize=28:fontcolor=white:box=1:boxcolor=black@0.65[right];[left][right]hstack=inputs=2[v]" -map "[v]" -t 10 -an -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p -r 24 target/ci-motion/legacy-vs-smooth.mp4
      - name: Upload sanitized legacy versus smooth proof
        uses: actions/upload-artifact@v7
        with:
          name: reel-v023-animatic-verification-proof
          path: |
            target/ci-motion/legacy-vs-smooth.mp4
            target/ci-motion/smooth-cadence.json
            target/ci-motion/smooth-motion-check.json
            target/ci-motion/smooth-animatic-check.json
            target/ci-motion/legacy-cadence.json
            target/ci-motion/smooth.artifacts.json
            target/ci-motion/smooth.receipt.json
            target/render-environment.json
