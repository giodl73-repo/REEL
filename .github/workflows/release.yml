name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: reel-linux-x86_64
            binary: target/release/reel
          - os: windows-latest
            artifact: reel-windows-x86_64
            binary: target/release/reel.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned GPL FFmpeg build for tests
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3 # v1.2.5
        with:
          version: "8.1"
          token: ${{ github.token }}
      - run: cargo test --all-targets --all-features
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.binary }}
          generate_release_notes: true
