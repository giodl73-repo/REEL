name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: reel-linux-x86_64
            binary: target/release/reel
          - os: windows-latest
            artifact: reel-windows-x86_64
            binary: target/release/reel.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets --all-features
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.binary }}
