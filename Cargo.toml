[package]
name = "reel"
version = "0.3.4"
edition = "2024"
rust-version = "1.85"
description = "Portable moving-image production manifests, series composition, and FFmpeg orchestration"
license = "MIT"
repository = "https://github.com/giodl73-repo/REEL"
readme = "README.md"
default-run = "reel"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "zeroize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tempfile = "3.24.0"
zeroize = "1.8.2"
image = { version = "0.25.9", default-features = false, features = ["png", "pnm"] }
same-file = "1.0.6"
reel-music = { path = "crates/reel-music" }

[features]
test-fixtures = []

[[bin]]
name = "fake_c2patool"
path = "src/bin/fake_c2patool.rs"
required-features = ["test-fixtures"]

[workspace]
members = ["crates/reel-music"]
resolver = "3"
